name: 'Build Totem USB Debugging'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '[ "xiao_ble//zmk" ]'
      shield: '[ "totem_left","totem_right", "totem_dongle", "settings_reset" ]'
      alphas: '[ "qwerty" ]'
      nav: '[ "vi" ]'
      kconfig: '["CONFIG_ZMK_POINTING=y"]'
